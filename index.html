<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор робота в комнатах</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Симулятор робота в комнатах</h1>
        </header>

        <main>
            <div class="simulation-area">
                <div class="controls-panel">
                    <div class="control-group">
                        <h3>Задание маршрута</h3>
                        <div class="path-controls">
                            <label for="start-room">Стартовая комната:</label>
                            <select id="start-room">
                                <option value="1">Комната 1</option>
                                <option value="2">Комната 2</option>
                                <option value="3">Комната 3</option>
                                <option value="4">Комната 4</option>
                                <option value="5">Комната 5</option>
                            </select>
                            
                            <label for="end-room">Целевая комната:</label>
                            <select id="end-room">
                                <option value="1">Комната 1</option>
                                <option value="2">Комната 2</option>
                                <option value="3">Комната 3</option>
                                <option value="4">Комната 4</option>
                                <option value="5">Комната 5</option>
                            </select>
                            
                            <button id="start-btn">Запустить робота</button>
                            <button id="reset-btn">Сбросить робота</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <h3>Управление метками</h3>
                        <div class="marker-controls">
                            <select id="marker-type">
                                <option value="landmark">Ориентир</option>
                                <option value="target">Цель</option>
                                <option value="hazard">Препятствие</option>
                            </select>
                            <button id="add-marker-btn">Добавить метку</button>
                            <button id="clear-markers-btn">Очистить все метки</button>
                            <div id="placement-hint" style="display: none; color: #e74c3c; font-size: 12px; margin-top: 5px;">
                                Кликните в текущей комнате робота для размещения метки
                            </div>
                        </div>
                    </div>

                    <div class="status-panel">
                        <h3>Статус робота</h3>
                        <div id="robot-status">Текущее положение: Комната 1</div>
                        <div id="detection-status">Обнаруженные метки: Нет</div>
                    </div>
                </div>

                <div class="visualization-area">
                    <canvas id="rooms-canvas" width="800" height="600"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="js/rooms.js"></script>
    <script src="js/robot.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
